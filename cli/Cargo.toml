[package]
name = "chef"
description = "Install, update and remove mods and plugins for GTA games"
edition = "2024"
version = "0.1.1"
license = "MIT"

[[bin]]
name = "chef"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crc32fast = "1.5.1"
dirs = "6.0.0"
dunce = "1.0.5"
flate2 = "1.1.9"
hex = "0.4.3"
lazy_static = "1.4.0"
log = "0.4.34"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10.9"
simplelog = "0.11.2"
tar = "0.4.46"
tempfile = "3.27.0"
ureq = { version = "2.12.1", default-features = false, features = ["tls", "gzip", "json"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[package.metadata.winres]
LegalCopyright = "Copyright © 2026 Seemann"
